# niri-session runs `systemctl --user import-environment` right before starting
# niri.service, which overwrites the user manager's PATH (including anything set
# in environment.d). Setting PATH here wins, because unit Environment= is applied
# when the service starts, after that import.
[Service]
# %h is systemd's home-directory specifier, so this works for any user name.
# mise shims cover node, npm and other mise-managed tools without pinning versions.
Environment=PATH=%h/.local/bin:%h/.local/share/mise/shims:%h/.cargo/bin:/usr/local/sbin:/usr/local/bin:/usr/bin:/var/lib/flatpak/exports/bin:/usr/bin/site_perl:/usr/bin/vendor_perl:/usr/bin/core_perl
