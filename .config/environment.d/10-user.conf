# Environment for user services started before the graphical session
# (keyring, portals, ...). The niri session gets its PATH from
# ~/.config/systemd/user/niri.service.d/10-path.conf, because niri-session
# imports /etc/profile's PATH over anything set here.
PATH=${HOME}/.local/bin:${HOME}/.local/share/mise/shims:${PATH}
EDITOR=nvim
VISUAL=nvim
