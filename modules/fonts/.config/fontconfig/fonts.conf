<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<fontconfig>
  <description>
    User font preferences: Inter for UI text, FiraCode Nerd Font for monospace,
    Noto CJK with correct per-language glyph variants.
  </description>

  <!--
    Why this file exists
    ====================
    The base `noto-fonts` and `ttf-dejavu` packages are not installed on this
    machine, so the generic families had nothing to resolve against except the
    Noto CJK collection. The result was that `sans-serif`, `serif` and
    `monospace` ALL matched "Noto ... CJK KR" (the Korean variant), even for
    Latin text, and even `:lang=ja` matched KR.

    The reason fontconfig cannot sort this out alone: every Noto CJK variant is
    packed into a single .ttc and advertises coverage for every CJK language,
    so the variants are indistinguishable by `lang` alone. The rules below pin
    the correct variant explicitly.
  -->

  <!-- ===================== Latin defaults ===================== -->

  <alias>
    <family>sans-serif</family>
    <prefer>
      <family>Inter</family>
      <family>Noto Sans CJK JP</family>
    </prefer>
  </alias>

  <alias>
    <family>serif</family>
    <prefer>
      <family>Noto Serif CJK JP</family>
    </prefer>
  </alias>

  <alias>
    <family>monospace</family>
    <prefer>
      <family>FiraCode Nerd Font</family>
      <family>Noto Sans Mono CJK JP</family>
    </prefer>
  </alias>

  <!-- ===================== CJK glyph variants =====================
       Scoped to the generic families on purpose: an explicit request for a
       concrete family (e.g. "Noto Serif CJK KR") must be left alone.

       Ordering note: the FIRST matching rule wins, verified with fc-match. So
       the generic `zh` rule is written LAST, after every more specific tag.
       The `zh` test is a substring match, so it also matches zh-tw / zh-hk /
       zh-hant; they only win because they are evaluated first.
    -->

  <!-- Japanese -->
  <match target="pattern">
    <test name="family"><string>sans-serif</string></test>
    <test name="lang" compare="contains"><string>ja</string></test>
    <edit name="family" mode="prepend" binding="strong"><string>Noto Sans CJK JP</string></edit>
  </match>
  <match target="pattern">
    <test name="family"><string>serif</string></test>
    <test name="lang" compare="contains"><string>ja</string></test>
    <edit name="family" mode="prepend" binding="strong"><string>Noto Serif CJK JP</string></edit>
  </match>
  <match target="pattern">
    <test name="family"><string>monospace</string></test>
    <test name="lang" compare="contains"><string>ja</string></test>
    <edit name="family" mode="prepend" binding="strong"><string>Noto Sans Mono CJK JP</string></edit>
  </match>

  <!-- Korean -->
  <match target="pattern">
    <test name="family"><string>sans-serif</string></test>
    <test name="lang" compare="contains"><string>ko</string></test>
    <edit name="family" mode="prepend" binding="strong"><string>Noto Sans CJK KR</string></edit>
  </match>
  <match target="pattern">
    <test name="family"><string>serif</string></test>
    <test name="lang" compare="contains"><string>ko</string></test>
    <edit name="family" mode="prepend" binding="strong"><string>Noto Serif CJK KR</string></edit>
  </match>
  <match target="pattern">
    <test name="family"><string>monospace</string></test>
    <test name="lang" compare="contains"><string>ko</string></test>
    <edit name="family" mode="prepend" binding="strong"><string>Noto Sans Mono CJK KR</string></edit>
  </match>

  <!-- Chinese, Hong Kong (before the generic `zh` rule) -->
  <match target="pattern">
    <test name="family"><string>sans-serif</string></test>
    <test name="lang" compare="contains"><string>zh-hk</string></test>
    <edit name="family" mode="prepend" binding="strong"><string>Noto Sans CJK HK</string></edit>
  </match>
  <match target="pattern">
    <test name="family"><string>serif</string></test>
    <test name="lang" compare="contains"><string>zh-hk</string></test>
    <edit name="family" mode="prepend" binding="strong"><string>Noto Serif CJK HK</string></edit>
  </match>
  <match target="pattern">
    <test name="family"><string>monospace</string></test>
    <test name="lang" compare="contains"><string>zh-hk</string></test>
    <edit name="family" mode="prepend" binding="strong"><string>Noto Sans Mono CJK HK</string></edit>
  </match>

  <!-- Chinese, Traditional Taiwan (before the generic `zh` rule) -->
  <match target="pattern">
    <test name="family"><string>sans-serif</string></test>
    <test name="lang" compare="contains"><string>zh-tw</string></test>
    <edit name="family" mode="prepend" binding="strong"><string>Noto Sans CJK TC</string></edit>
  </match>
  <match target="pattern">
    <test name="family"><string>serif</string></test>
    <test name="lang" compare="contains"><string>zh-tw</string></test>
    <edit name="family" mode="prepend" binding="strong"><string>Noto Serif CJK TC</string></edit>
  </match>
  <match target="pattern">
    <test name="family"><string>monospace</string></test>
    <test name="lang" compare="contains"><string>zh-tw</string></test>
    <edit name="family" mode="prepend" binding="strong"><string>Noto Sans Mono CJK TC</string></edit>
  </match>

  <!-- Chinese, Traditional generic BCP-47 tag (before the generic `zh` rule) -->
  <match target="pattern">
    <test name="family"><string>sans-serif</string></test>
    <test name="lang" compare="contains"><string>zh-hant</string></test>
    <edit name="family" mode="prepend" binding="strong"><string>Noto Sans CJK TC</string></edit>
  </match>
  <match target="pattern">
    <test name="family"><string>serif</string></test>
    <test name="lang" compare="contains"><string>zh-hant</string></test>
    <edit name="family" mode="prepend" binding="strong"><string>Noto Serif CJK TC</string></edit>
  </match>
  <match target="pattern">
    <test name="family"><string>monospace</string></test>
    <test name="lang" compare="contains"><string>zh-hant</string></test>
    <edit name="family" mode="prepend" binding="strong"><string>Noto Sans Mono CJK TC</string></edit>
  </match>

  <!-- Chinese, generic: Simplified. LAST on purpose: the `zh` substring test
       also matches zh-tw / zh-hk / zh-hant, so it must be evaluated after them. -->
  <match target="pattern">
    <test name="family"><string>sans-serif</string></test>
    <test name="lang" compare="contains"><string>zh</string></test>
    <edit name="family" mode="prepend" binding="strong"><string>Noto Sans CJK SC</string></edit>
  </match>
  <match target="pattern">
    <test name="family"><string>serif</string></test>
    <test name="lang" compare="contains"><string>zh</string></test>
    <edit name="family" mode="prepend" binding="strong"><string>Noto Serif CJK SC</string></edit>
  </match>
  <match target="pattern">
    <test name="family"><string>monospace</string></test>
    <test name="lang" compare="contains"><string>zh</string></test>
    <edit name="family" mode="prepend" binding="strong"><string>Noto Sans Mono CJK SC</string></edit>
  </match>

  <!--
    Emoji is deliberately NOT configured here. fontconfig's own
    /etc/fonts/conf.d/60-generic.conf already prefers color emoji for the
    `und-zsye` language tag, and `Noto Color Emoji` is the only font on this
    system covering U+1F600. Adding a hand-rolled emoji rule would risk
    fighting it.
  -->
</fontconfig>
