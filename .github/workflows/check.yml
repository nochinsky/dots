name: Check

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
      - name: Installer behavior
        run: python -m unittest discover -s tests -v
      - name: Config formats and documentation
        run: python scripts/check.py
      - name: Shell syntax
        run: |
          bash -n modules/bash/.bashrc modules/bash/.bash_profile
          sh -n scripts/apply-gtk.sh

  desktop-configs:
    runs-on: ubuntu-latest
    container: archlinux:base
    steps:
      - name: Install current Arch validators
        run: pacman -Syu --needed --noconfirm git niri noctalia
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: niri and Noctalia semantics
        run: |
          niri validate -c modules/niri/.config/niri/config.kdl
          noctalia config validate modules/noctalia/.config/noctalia/config.toml
